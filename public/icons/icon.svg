<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3829"/>
      <stop offset="50%" stop-color="#06241a"/>
      <stop offset="100%" stop-color="#02140e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe27a"/>
      <stop offset="50%" stop-color="#e5b842"/>
      <stop offset="100%" stop-color="#b88618"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(229,184,66,0.2)" stroke-width="3"/>
  <!-- Bails -->
  <rect x="156" y="146" width="200" height="16" rx="8" fill="url(#gold)" filter="url(#glow)"/>
  <circle cx="218" cy="154" r="14" fill="url(#gold)"/>
  <circle cx="294" cy="154" r="14" fill="url(#gold)"/>
  <!-- Wickets -->
  <rect x="174" y="172" width="22" height="206" rx="11" fill="url(#gold)"/>
  <rect x="245" y="172" width="22" height="206" rx="11" fill="url(#gold)"/>
  <rect x="316" y="172" width="22" height="206" rx="11" fill="url(#gold)"/>
  <!-- Cricket Ball -->
  <circle cx="346" cy="304" r="48" fill="url(#gold)" filter="url(#glow)"/>
  <path d="M 314 286 C 330 300, 344 322, 354 348" stroke="#06241a" stroke-width="4" stroke-dasharray="4,4" fill="none"/>
  <path d="M 322 280 C 338 294, 352 316, 362 342" stroke="#06241a" stroke-width="4" stroke-dasharray="4,4" fill="none"/>
</svg>
